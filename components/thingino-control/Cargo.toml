[package]
name = "thingino-control"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "thingino-controld"
path = "src/main.rs"
required-features = ["raptor-backend"]

[dependencies]

[features]
default = ["raptor-backend"]
raptor-backend = []

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
