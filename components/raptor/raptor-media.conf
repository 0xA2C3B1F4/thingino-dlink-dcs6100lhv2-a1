[sensor]
name = os02g10
i2c_addr = 60
i2c_adapter = 0
rst_gpio = 18
fps = 15
isp_bypass = false
antiflicker = 2

[stream0]
enabled = true
nr_vbs = 1
width = 1920
height = 1080
fps = 15
codec = h264
bitrate = 1500000
gop = 15
ivdc = false
osd_enabled = true
jpeg = true

[stream1]
nr_vbs = 1
enabled = true
width = 640
height = 360
fps = 15
codec = h264
bitrate = 400000
gop = 15
osd_enabled = true
jpeg = true

[jpeg]
enabled = true
fps = 1
quality = 65
idle = true
bufshare = false

[ring]
refmode = false
main_slots = 16
sub_slots = 16

[http]
enabled = true
bind_address = 127.0.0.1
port = 8080
https = false
sign_snapshots = false

[rtsp]
enabled = true
bind_address = 127.0.0.1
port = 8554
tls = false
backchannel = false

[ircut]
enabled = true
mode = day
gpio_ircut = 50
gpio_ircut2 = 49
gpio_irled = 61
gpio_irled2 = -1
ir940 = false

[osd]
enabled = true
text_enabled = true
isp_osd = false
font = /usr/share/fonts/default.ttf
font_size = 48
font_color = 0xFFFFFFFF
font_stroke = 1
stroke_color = 0xFF000000
pool_kb = 1024
privacy_color = 0xFF000000

[osd.timestamp]
type = text
template = %time%
position = top_left
align = left
max_chars = 22

[osd_metadata]
enabled = false
entry_count = 0

[audio]
enabled = false

[recording]
enabled = false

[motion]
enabled = true
algorithm = move
sensitivity = 0
grid = 4x4
roi_count = 1
roi0 = 0,0,639,359
cooldown_sec = 2
poll_interval_ms = 500
skip_frames = 5
record = false
gpio_pin = -1

[webrtc]
enabled = false

[privacy]
enabled = false

# S96raptor starts these owners even when audio or recording is disabled.
# ROD renders OSD text into bitmaps and RVD applies them. No single-channel RMR
# owner is started.
[timezone]
rvd = true
rsd = true
rhd = true
rad = true
ric = true
rod = true
rmr = false
rmr0 = true
rmr1 = true
rwd = true
